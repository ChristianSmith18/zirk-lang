<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="title">
  <title id="title">Zirk Logo - LinkedIn Avatar</title>
  
  <defs>
    <!-- Solid Background Gradient (Full Bleed) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Zirk Mark Gradient -->
    <linearGradient id="zirkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Drop Shadow for the Z-Mark itself -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 100% Solid Full-Bleed Background (No rounded corners, no transparent borders) -->
  <rect width="300" height="300" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow behind the logo -->
  <circle cx="150" cy="150" r="100" fill="#a78bfa" opacity="0.1" filter="blur(40px)"/>

  <!-- Zirk Logo Mark Group centered with Safe Circular Margin for LinkedIn -->
  <g filter="url(#markShadow)">
    <g transform="translate(30, 30) scale(5)">
      <!-- Base Z Shape (80% width, uniform stroke thickness) -->
      <path fill="none" stroke="url(#zirkGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.25" d="M12.8 12h20L14.4 36h20.8"/>

      <!-- Antigravity Crossing Slash -->
      <path fill="none" stroke="url(#slashGrad)" stroke-linecap="round" stroke-width="5.25" d="M16 8l16 32"/>
    </g>
  </g>
</svg>
