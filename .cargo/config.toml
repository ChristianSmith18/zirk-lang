# Configuración de Cargo versionada.
#
# Acá NO van rutas absolutas específicas de una máquina: `LLVM_SYS_201_PREFIX`
# se resuelve por entorno, según ADR-004. Lo que sí corresponde versionar son
# flags de compilación que dependen del target y son iguales para todos.

# El tarball oficial de LLVM para Windows se compila contra la CRT estática
# (declara LIBCMT), mientras que el target x86_64-pc-windows-msvc de Rust usa
# la CRT dinámica por defecto (MSVCRT). Mezclarlas pone dos heaps distintos en
# el mismo proceso: la memoria que reserva LLVM y libera Rust —o al revés—
# cruza la frontera y el proceso muere con STATUS_ACCESS_VIOLATION en la
# primera llamada real a codegen.
#
# Diagnosticado en el issue #2, confirmado leyendo las directivas /DEFAULTLIB
# del propio LLVMSupport.lib: 159 referencias a LIBCMT y ninguna a MSVCRT.
#
# Efecto secundario deseable: los binarios resultantes no dependen de que la
# máquina tenga instalado el redistribuible de Visual C++, lo que va en la
# dirección de los binarios standalone que promete ZIRK_SPEC_FINAL.md.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
