version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # inkwell esta pineado a una version mayor de LLVM (ADR-001). Subirlo no es
    # una actualizacion de rutina: requiere cambiar la feature, el build script
    # y la instalacion en las tres plataformas.
    ignore:
      - dependency-name: inkwell
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"
