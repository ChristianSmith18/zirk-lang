name: CI

# La matriz es la definición operativa de "portable" (design D5): la portabilidad
# se considera no verificada hasta que estos jobs estén en verde.
# Ver docs/decisions/ADR-004-portabilidad.md

# Modelo de ramas: git flow.
#   feature/* ──▶ develop ──▶ release/* ──▶ main
#   hotfix/*  ──▶ main + develop
# CI corre en las dos ramas de larga vida y en toda PR que apunte a ellas.
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional end-to-end test-name filter for native diagnostics
        required: false
        default: ""
        type: string
      runtime_test_filter:
        description: Optional zirk-runtime library test-name filter for native diagnostics
        required: false
        default: ""
        type: string
      platform_filter:
        description: Native runner selection for focused diagnostics
        required: false
        default: auto
        type: choice
        options:
          - auto
          - all
          - linux-x86_64
          - linux-aarch64
          - windows-x86_64
          - macos-aarch64

# Una PR con varios pushes seguidos cancela sus ejecuciones anteriores: la
# matriz es cara y solo importa el ultimo commit.
concurrency:
  # Keep focused workflow_dispatch diagnostics independent from the full push
  # matrix so native platform failures can be isolated without waiting for it.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.test_filter || inputs.runtime_test_filter || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Version mayor de LLVM pineada. Debe coincidir con la feature `llvm20-1` de
  # inkwell y con la constante LLVM_MAJOR del build script.
  # Ver docs/decisions/ADR-001-pin-llvm.md
  LLVM_VERSION: "20"
  LLVM_FULL_VERSION: "20.1.8"

jobs:
  browser-wasm-fetch:
    name: browser-wasm-fetch
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.test_filter == '' && inputs.runtime_test_filter == '')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain and browser target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2

      - name: Install the matching wasm-bindgen CLI
        run: cargo install --locked --version 0.2.128 wasm-bindgen-cli

      - name: Verify browser Fetch HTTP behavior
        run: scripts/test-browser-http-fetch.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Un fallo en una plataforma no debe ocultar el estado de las demas:
      # necesitamos saber si el problema es de una o de todas.
      fail-fast: false
      # macOS volvio a la matriz al hacerse publico el repositorio: Actions
      # es gratis e ilimitado ahi, y el argumento de costo que lo habia
      # dejado fuera desaparecio. Ver ADR-004.
      #
      # macos-13 (Intel) sigue fuera: sus runners son escasos y quedaba
      # encolado indefinidamente mientras el resto de la matriz completaba.
      #
      # aarch64-windows tambien sigue fuera: apila un riesgo nuevo sobre la
      # plataforma que todavia no esta estable.
      matrix: >-
        ${{ fromJSON(
          (github.event_name != 'workflow_dispatch'
            || inputs.platform_filter == 'all'
            || (inputs.platform_filter == 'auto'
              && inputs.test_filter == ''
              && inputs.runtime_test_filter == ''))
          && '{"include":[{"name":"linux-x86_64","runner":"ubuntu-latest"},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"name":"windows-x86_64","runner":"windows-latest"},{"name":"macos-aarch64","runner":"macos-14"}]}'
          || (inputs.platform_filter == 'linux-x86_64'
            && '{"include":[{"name":"linux-x86_64","runner":"ubuntu-latest"}]}')
          || (inputs.platform_filter == 'linux-aarch64'
            && '{"include":[{"name":"linux-aarch64","runner":"ubuntu-24.04-arm"}]}')
          || (inputs.platform_filter == 'macos-aarch64'
            && '{"include":[{"name":"macos-aarch64","runner":"macos-14"}]}')
          || '{"include":[{"name":"windows-x86_64","runner":"windows-latest"}]}'
        ) }}

    steps:
      - uses: actions/checkout@v4

      # --- LLVM: Linux -----------------------------------------------------
      # apt.llvm.org publica las bibliotecas estaticas en el paquete -dev, que
      # es lo que llvm-sys necesita para enlazar.
      - name: Instalar LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y \
            "llvm-${LLVM_VERSION}-dev" \
            "libpolly-${LLVM_VERSION}-dev" \
            "lld-${LLVM_VERSION}"
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-${LLVM_VERSION}" >> "$GITHUB_ENV"

      # --- LLVM: macOS -----------------------------------------------------
      - name: Instalar LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install "llvm@${LLVM_VERSION}" "lld@${LLVM_VERSION}"
          echo "LLVM_SYS_201_PREFIX=$(brew --prefix llvm@${LLVM_VERSION})" >> "$GITHUB_ENV"

      # --- LLVM: Windows ---------------------------------------------------
      # NO se usa la distribucion oficial de LLVM para Windows. Se probaron sus
      # cuatro combinaciones y ninguna funciona con llvm-sys (ver issue #2):
      #
      #   - enlace estatico: el tarball se compila con la CRT estatica y Rust
      #     usa la dinamica; el proceso aborta en LLVMGetDefaultTargetTriple;
      #   - crt-static en Rust: llvm-sys fuerza entonces todas las bibliotecas
      #     del sistema a estaticas, y psapi solo existe como import library;
      #   - force-dynamic: su llvm-config no soporta --link-shared;
      #   - prefer-dynamic: cae de vuelta al estatico y repite el primer caso.
      #
      # Se usa un build de terceros mantenido especificamente para que inkwell
      # funcione en Windows, compilado con la CRT que corresponde. La version
      # coincide exactamente con el pin del proyecto.
      #
      # Es una dependencia de un solo mantenedor y eso es un riesgo de cadena de
      # suministro asumido conscientemente: la alternativa es compilar LLVM
      # desde fuente en CI, que son horas por build. Ver ADR-001.
      - name: Cachear LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-windows
        uses: actions/cache@v4
        with:
          path: C:\LLVM
          key: llvm-${{ env.LLVM_FULL_VERSION }}-windows-x86_64-inkwell

      - name: Instalar LLVM (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archivo = "LLVM-$env:LLVM_FULL_VERSION-win64.7z"
          $url = "https://github.com/TyrsDev/llvm-package-windows/releases/download/v$env:LLVM_FULL_VERSION/$archivo"

          Write-Host "Descargando $url"
          Invoke-WebRequest -Uri $url -OutFile $archivo

          7z x $archivo -oC:\extracted -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z terminó con código $LASTEXITCODE" }

          # El paquete puede traer todo en la raiz o dentro de un directorio.
          # Se resuelve en vez de asumirlo.
          if (Test-Path C:\extracted\bin\llvm-config.exe) {
            $origen = "C:\extracted"
          } else {
            $sub = Get-ChildItem -Path C:\extracted -Directory | Select-Object -First 1
            if (-not $sub) { throw "el paquete de LLVM no tiene la estructura esperada" }
            $origen = $sub.FullName
          }

          New-Item -ItemType Directory -Force -Path C:\LLVM | Out-Null
          Move-Item -Path "$origen\*" -Destination C:\LLVM -Force

          if (-not (Test-Path C:\LLVM\bin\llvm-config.exe)) {
            throw "falta llvm-config.exe: la instalacion de LLVM quedo incompleta"
          }

      - name: Declarar prefijo de LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LLVM_SYS_201_PREFIX=C:/LLVM" >> $env:GITHUB_ENV

      # --- Verificacion del toolchain --------------------------------------
      - name: Verificar LLVM
        shell: bash
        run: |
          "$LLVM_SYS_201_PREFIX/bin/llvm-config" --version
          test -d "$LLVM_SYS_201_PREFIX/lib" || { echo "falta el directorio lib"; exit 1; }

      - name: Verify Windows LLVM IR verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opt = Join-Path $env:LLVM_SYS_201_PREFIX 'bin/opt.exe'
          if (-not (Test-Path $opt)) { throw "LLVM verifier was not found at $opt" }
          & $opt --version

      # --- Rust ------------------------------------------------------------
      # La version sale de rust-toolchain.toml; rustup la instala solo.
      - name: Mostrar toolchain de Rust
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Check dependency licenses
        if: matrix.name == 'linux-x86_64' && inputs.test_filter == '' && inputs.runtime_test_filter == ''
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo-deny check licenses

      # --- Build y verificacion --------------------------------------------
      - name: Formato
        run: cargo fmt --all --check

      - name: Build
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        run: cargo build --workspace

      # A permission-isolation E2E clears the child process environment. Restore
      # the native linker/SDK variables before running conformance on Windows.
      - name: Prepare the MSVC linker environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'No Visual Studio installation with x64 C++ tools was found.' }
          $vcvars = Join-Path $vsInstall 'VC/Auxiliary/Build/vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat was not found at $vcvars" }

          $toolchain = & cmd.exe /d /s /c "call `"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with exit code $LASTEXITCODE" }
          $required = @('INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCIDEInstallDir', 'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'UniversalCRTSdkDir', 'UCRTVersion', 'VisualStudioVersion', 'VSCMD_VER', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_app_plat', 'DevEnvDir')
          foreach ($line in $toolchain) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) { continue }
            $name = $line.Substring(0, $separator)
            if ($required -contains $name) {
              $value = $line.Substring($separator + 1)
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Set-Item -Path "Env:$name" -Value $value
            }
          }

          $msvcBin = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64'
          $msvcLinker = Join-Path $msvcBin 'link.exe'
          if (-not (Test-Path $msvcLinker)) { throw "MSVC linker was not found at $msvcLinker" }
          $env:PATH = "$msvcBin;$env:PATH"
          $msvcBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLinker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $resolvedLinker = (Get-Command link.exe).Source
          if ($resolvedLinker -ne $msvcLinker) { throw "Expected MSVC linker '$msvcLinker', resolved '$resolvedLinker'" }

      - name: Native filesystem conformance
        if: github.event_name != 'workflow_dispatch' || (inputs.test_filter == '' && inputs.runtime_test_filter == '')
        shell: bash
        run: |
          cargo test -p zirk-runtime --lib filesystem::tests -- --test-threads=1 --nocapture
          cargo test -p zirk-cli --test end_to_end bundled_std_fs_ -- --test-threads=1 --nocapture

      # Make the GC/managed-thread regressions an explicit Windows signal.
      # The full workspace suite below also runs them, but this focused step
      # makes failures attributable and visible before the broader test run.
      - name: GC y managed threads (Windows)
        if: runner.os == 'Windows' && inputs.test_filter == '' && inputs.runtime_test_filter == ''
        shell: bash
        run: |
          cargo test -p zirk-runtime --test gc_registered_participant_lifecycle -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --test gc_worker_root_stress -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --test gc_mutex_abi -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --test managed_callback_shutdown_lifetime -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --test cancel_shutdown_gc_stress -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --test collector_concurrency_stress -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --lib blocked_native_mutator_keeps_stable_roots_visible_to_collection -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --lib collection_preserves_object_rooted_by_registered_native_thread -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --lib unregister_waits_until_collection_stops_scanning_its_roots -- --test-threads=1 --nocapture
          cargo test -p zirk-runtime --test optimization_bench mixed_task_and_registered_worker_waiters_keep_fifo_order -- --test-threads=1 --nocapture

      - name: Formato canónico
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        shell: bash
        run: ./scripts/check-format.sh

      - name: Enable focused native crash dumps (Windows)
        if: runner.os == 'Windows' && inputs.test_filter != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'zirk-native-dumps'
          New-Item -ItemType Directory -Force -Path $dumpDirectory | Out-Null
          $registryPath = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $registryPath -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpFolder -Value $dumpDirectory -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpCount -Value 3 -PropertyType DWord -Force | Out-Null

      - name: Build focused filesystem prerequisites
        if: inputs.test_filter != ''
        run: cargo build -p zirk-cli -p zirk-runtime

      # Run this after native conformance so unrelated workspace lint failures
      # cannot suppress the filesystem security/API evidence on a platform.
      - name: Clippy
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --test-threads=1 no es solo diagnostico: LLVM mantiene estado global de
      # proceso que no tolera uso concurrente, y esta suite lo ejerce de forma
      # intensiva. Ejecutar en serie es la unica garantia real; el costo es
      # despreciable con esta cantidad de tests.
      - name: Focused tests (Windows)
        if: runner.os == 'Windows' && inputs.test_filter != ''
        run: |
          Write-Host "Running focused end-to-end tests matching: $env:TEST_FILTER"
          cargo test -p zirk-cli --test end_to_end "$env:TEST_FILTER" -- --test-threads=1 --nocapture
          cargo test -p zirk-codegen-llvm --test emission "$env:TEST_FILTER" -- --test-threads=1 --nocapture
          cargo test -p zirk-browser "$env:TEST_FILTER" -- --nocapture
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          RUST_BACKTRACE: "1"
          ZIRK_TRACE: "1"

      - name: Focused tests (Unix)
        if: runner.os != 'Windows' && inputs.test_filter != ''
        run: |
          echo "Running focused end-to-end tests matching: $TEST_FILTER"
          cargo test -p zirk-cli --test end_to_end "$TEST_FILTER" -- --test-threads=1 --nocapture
          cargo test -p zirk-codegen-llvm --test emission "$TEST_FILTER" -- --test-threads=1 --nocapture
          cargo test -p zirk-browser "$TEST_FILTER" -- --nocapture
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          RUST_BACKTRACE: "1"
          ZIRK_TRACE: "1"

      - name: Focused runtime tests (Windows)
        if: runner.os == 'Windows' && inputs.runtime_test_filter != ''
        run: cargo test -p zirk-runtime --lib "$env:RUNTIME_TEST_FILTER" -- --test-threads=1 --nocapture
        env:
          RUNTIME_TEST_FILTER: ${{ inputs.runtime_test_filter }}
          RUST_BACKTRACE: "1"

      - name: Focused runtime tests (Unix)
        if: runner.os != 'Windows' && inputs.runtime_test_filter != ''
        run: cargo test -p zirk-runtime --lib "$RUNTIME_TEST_FILTER" -- --test-threads=1 --nocapture
        env:
          RUNTIME_TEST_FILTER: ${{ inputs.runtime_test_filter }}
          RUST_BACKTRACE: "1"

      # These transport and protocol engines are opt-in in release builds, so
      # the ordinary workspace suite does not compile or exercise them. Keep
      # their target-specific runtime behavior visible on every native runner.
      - name: Networking and HTTP/3 runtime conformance
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        shell: bash
        run: |
          cargo test -p zirk-runtime --features http3 --lib udp -- --test-threads=1
          cargo test -p zirk-runtime --features http3 --lib local_transport::tests -- --test-threads=1
          cargo test -p zirk-runtime --features http3 --lib network_interfaces::tests -- --test-threads=1
          cargo test -p zirk-runtime --features http3 --lib network_transport::tests::tls_ -- --test-threads=1
          cargo test -p zirk-runtime --features http3 --lib http3_transport::tests -- --test-threads=1
          cargo test -p zirk-runtime-core network_policy -- --test-threads=1

      # Keep the type-algebra runtime contract visible as a focused signal on
      # every native ABI runner, including Windows. The full workspace suite
      # below remains authoritative for broader regressions.
      - name: Union ABI and interpreter parity
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        shell: bash
        run: |
          cargo test -p zirk-codegen-llvm --test emission union -- --test-threads=1
          cargo test -p zirk-cli --test end_to_end heterogeneous_union_ -- --test-threads=1
          cargo test -p zirk-cli --test object_engine_parity union -- --test-threads=1

      - name: Tests
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        run: cargo test --workspace -- --test-threads=1 --nocapture
        env:
          RUST_BACKTRACE: "1"
          # Trazas del backend: un fallo dentro de LLVM puede abortar sin dejar
          # mensaje, y sin esto no hay forma de ubicar el punto exacto (#2).
          ZIRK_TRACE: "1"

      - uses: actions/setup-python@v5
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        with:
          python-version: "3.14"

      - name: Install pinned independent HTTP/3 peer
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-http3-interop.txt

      - name: Public HTTP/3 WebSocket interoperability
        if: inputs.test_filter == '' && inputs.runtime_test_filter == ''
        run: python scripts/test-http3-websocket-public-api.py

      - name: Upload focused native crash dumps (Windows)
        if: failure() && runner.os == 'Windows' && (inputs.test_filter != '' || inputs.runtime_test_filter != '')
        uses: actions/upload-artifact@v4
        with:
          name: zirk-native-dumps-${{ github.run_id }}
          path: ${{ runner.temp }}/zirk-native-dumps/*.dmp
          if-no-files-found: warn
          retention-days: 1

      # Native Zirk executables can fail after producing their expected output.
      # End-to-end tests execute generated binaries in temporary project folders,
      # not necessarily under the checkout. Surface fault metadata without dumps.
      - name: Diagnose native Zirk crashes (Windows)
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $events = Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            ProviderName = 'Application Error'
            Id = 1000
            StartTime = (Get-Date).AddHours(-3)
          } -ErrorAction SilentlyContinue

          $crashEvents = foreach ($event in $events) {
            $data = @{}
            foreach ($item in ([xml]$event.ToXml()).Event.EventData.Data) {
              $data[[string]$item.Name] = [string]$item.'#text'
            }
            $appPath = [string]$data.AppPath
            $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
            $tempRoot = [IO.Path]::GetFullPath([IO.Path]::GetTempPath()).TrimEnd('\') + '\'
            $isWorkspaceExecutable = $appPath.StartsWith($workspaceRoot, [StringComparison]::OrdinalIgnoreCase)
            $isTemporaryExecutable = $appPath.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase)
            if ($isWorkspaceExecutable -or $isTemporaryExecutable) {
              [pscustomobject]@{
                Time = $event.TimeCreated.ToUniversalTime().ToString('o')
                App = $data.AppName
                AppPath = $appPath
                Module = $data.ModuleName
                ModulePath = $data.ModulePath
                ExceptionCode = $data.ExceptionCode
                FaultingOffset = $data.FaultingOffset
                ProcessId = $data.ProcessId
              }
            }
          }

          if ($crashEvents) {
            $crashEvents | Format-Table -AutoSize | Out-String | Write-Host
          } else {
            Write-Host 'No Application Error events for executables under the workspace or temp directory were found.'
          }
