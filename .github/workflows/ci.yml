name: CI

# La matriz es la definición operativa de "portable" (design D5): la portabilidad
# se considera no verificada hasta que estos jobs estén en verde.
# Ver docs/decisions/ADR-004-portabilidad.md

# Modelo de ramas: git flow.
#   feature/* ──▶ develop ──▶ release/* ──▶ main
#   hotfix/*  ──▶ main + develop
# CI corre en las dos ramas de larga vida y en toda PR que apunte a ellas.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Una PR con varios pushes seguidos cancela sus ejecuciones anteriores: la
# matriz es cara y solo importa el ultimo commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Version mayor de LLVM pineada. Debe coincidir con la feature `llvm20-1` de
  # inkwell y con la constante LLVM_MAJOR del build script.
  # Ver docs/decisions/ADR-001-pin-llvm.md
  LLVM_VERSION: "20"
  LLVM_FULL_VERSION: "20.1.8"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Un fallo en una plataforma no debe ocultar el estado de las demas:
      # necesitamos saber si el problema es de una o de todas.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: windows-x86_64
            runner: windows-latest
          - name: macos-aarch64
            runner: macos-14
          #
          # macOS volvio a la matriz al hacerse publico el repositorio: Actions
          # es gratis e ilimitado ahi, y el argumento de costo que lo habia
          # dejado fuera desaparecio. Ver ADR-004.
          #
          # macos-13 (Intel) sigue fuera: sus runners son escasos y quedaba
          # encolado indefinidamente mientras el resto de la matriz completaba.
          #
          # aarch64-windows tambien sigue fuera: apila un riesgo nuevo sobre la
          # plataforma que todavia no esta estable.

    steps:
      - uses: actions/checkout@v4

      # --- LLVM: Linux -----------------------------------------------------
      # apt.llvm.org publica las bibliotecas estaticas en el paquete -dev, que
      # es lo que llvm-sys necesita para enlazar.
      - name: Instalar LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y \
            "llvm-${LLVM_VERSION}-dev" \
            "libpolly-${LLVM_VERSION}-dev" \
            "lld-${LLVM_VERSION}"
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-${LLVM_VERSION}" >> "$GITHUB_ENV"

      # --- LLVM: macOS -----------------------------------------------------
      - name: Instalar LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install "llvm@${LLVM_VERSION}" "lld@${LLVM_VERSION}"
          echo "LLVM_SYS_201_PREFIX=$(brew --prefix llvm@${LLVM_VERSION})" >> "$GITHUB_ENV"

      # --- LLVM: Windows ---------------------------------------------------
      # El instalador .exe oficial NO incluye las bibliotecas estaticas ni las
      # cabeceras que llvm-sys necesita: hay que usar el tarball de desarrollo.
      # Es la causa mas comun de fallos de build en Windows.
      # Ver docs/TOOLCHAIN.md
      - name: Cachear LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-windows
        uses: actions/cache@v4
        with:
          path: C:\LLVM
          key: llvm-${{ env.LLVM_FULL_VERSION }}-windows-x86_64

      - name: Instalar LLVM (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "clang+llvm-$env:LLVM_FULL_VERSION-x86_64-pc-windows-msvc"
          $url  = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_FULL_VERSION/$name.tar.xz"

          Write-Host "Descargando $url"
          Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz

          # 7z viene preinstalado en los runners de Windows y maneja xz de forma
          # confiable, a diferencia del tar.exe del sistema.
          #
          # El switch -o de 7-Zip exige la ruta pegada y rechaza `-o.` como
          # "too short switch". Sin -o extrae al directorio actual, que es lo
          # que se necesita para el primer paso.
          7z x llvm.tar.xz -y
          7z x llvm.tar -oC:\extracted -y

          # El tarball trae un unico directorio raiz con el nombre del release.
          # Se resuelve en vez de asumirlo: si upstream lo cambia, conviene
          # fallar con un mensaje claro y no con un path inexistente.
          $root = Get-ChildItem -Path C:\extracted -Directory | Select-Object -First 1
          if (-not $root) {
            throw "el tarball de LLVM no contiene un directorio raiz en C:\extracted"
          }
          Write-Host "Directorio raiz extraido: $($root.Name)"

          New-Item -ItemType Directory -Force -Path C:\LLVM | Out-Null
          Move-Item -Path "$($root.FullName)\*" -Destination C:\LLVM -Force

          if (-not (Test-Path C:\LLVM\bin\llvm-config.exe)) {
            throw "falta llvm-config.exe: la instalacion de LLVM quedo incompleta"
          }

      # Desde LLVM 14, la build de Windows se compila con soporte de libxml2 y
      # `llvm-config --system-libs` la declara como dependencia del sistema.
      # El tarball oficial no incluye libxml2s.lib, asi que sin esto el enlace
      # falla con LNK1181. En Linux y macOS libxml2 esta deshabilitada y el
      # problema no existe.
      # Se genera un archivo vacio en vez de instalar libxml2 de verdad, y la
      # razon es que el enlace nunca necesita sus simbolos:
      #
      #   - LNK1181 se produce al no *encontrar el archivo*, antes de resolver
      #     ningun simbolo;
      #   - el unico componente de LLVM que usa libxml2 es WindowsManifest, y
      #     el linker solo extrae objetos de un archivo cuando algo referencia
      #     sus simbolos. Zirk no lo hace.
      #
      # Se usa llvm-lib del propio LLVM ya instalado: cero dependencias nuevas
      # y cero red, a diferencia de vcpkg, que compila zlib y libxml2 desde
      # fuente en cada ejecucion y falla ante cualquier intermitencia.
      #
      # Si en el futuro aparece un LNK2019 por simbolos de libxml2, significa
      # que algo si los referencia y hay que instalar la biblioteca real.
      - name: Proveer stub de libxml2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stubDir = "C:\llvm-stubs"
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null

          # El archivo debe contener al menos un objeto COFF real. Un archivo
          # vacio (llvm-lib /llvmlibempty) produce LNK1107 en link.exe: le
          # falta la tabla de simbolos que MSVC exige.
          Set-Content -Path "$stubDir\stub.c" -Value "" -NoNewline
          & "C:\LLVM\bin\clang.exe" --target=x86_64-pc-windows-msvc `
            -c "$stubDir\stub.c" -o "$stubDir\stub.obj"
          & "C:\LLVM\bin\llvm-lib.exe" "/OUT:$stubDir\libxml2s.lib" "$stubDir\stub.obj"

          if (-not (Test-Path "$stubDir\libxml2s.lib")) {
            throw "no se pudo generar el stub libxml2s.lib con llvm-lib"
          }

          echo "LIB=$stubDir;$env:LIB" >> $env:GITHUB_ENV

      - name: Declarar prefijo de LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LLVM_SYS_201_PREFIX=C:/LLVM" >> $env:GITHUB_ENV

      # Diagnostico de #2: la primera llamada a codegen de LLVM produce
      # STATUS_ACCESS_VIOLATION en Windows. Desde Linux si se emiten objetos
      # para x86_64-pc-windows-msvc, asi que el target funciona y el problema
      # es ejecutar LLVM *sobre* Windows. La hipotesis principal es que la CRT
      # contra la que se compilo LLVM no coincide con la que usa Rust.
      # En Windows se enlaza contra LLVM-C.dll (ver #2 y el Cargo.toml de
      # zirk-codegen-llvm). El DLL debe estar en el PATH para que los binarios
      # de test lo encuentren en tiempo de ejecucion, no solo al enlazar.
      - name: Exponer LLVM-C.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "== DLLs disponibles en C:\LLVM\bin =="
          Get-ChildItem C:\LLVM\bin -Filter *.dll | ForEach-Object {
            Write-Host ("  {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
          }
          if (-not (Test-Path C:\LLVM\bin\LLVM-C.dll)) {
            throw "el tarball de LLVM no incluye LLVM-C.dll: el enlace dinamico no es viable"
          }
          echo "C:\LLVM\bin" >> $env:GITHUB_PATH

      # --- Verificacion del toolchain --------------------------------------
      - name: Verificar LLVM
        shell: bash
        run: |
          "$LLVM_SYS_201_PREFIX/bin/llvm-config" --version
          test -d "$LLVM_SYS_201_PREFIX/lib" || { echo "falta el directorio lib"; exit 1; }

      # --- Rust ------------------------------------------------------------
      # La version sale de rust-toolchain.toml; rustup la instala solo.
      - name: Mostrar toolchain de Rust
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # --- Build y verificacion --------------------------------------------
      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # --test-threads=1 no es solo diagnostico: LLVM mantiene estado global de
      # proceso que no tolera uso concurrente, y esta suite lo ejerce de forma
      # intensiva. Ejecutar en serie es la unica garantia real; el costo es
      # despreciable con esta cantidad de tests.
      - name: Tests
        run: cargo test --workspace -- --test-threads=1 --nocapture
        env:
          RUST_BACKTRACE: "1"
