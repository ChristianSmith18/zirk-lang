[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
# Crates internos. Las dependencias entre etapas fluyen en un solo sentido
# a lo largo del pipeline; zirk-diagnostics es la unica transversal permitida.
zirk-ast = { path = "crates/zirk-ast" }
zirk-codegen-llvm = { path = "crates/zirk-codegen-llvm" }
zirk-diagnostics = { path = "crates/zirk-diagnostics" }
zirk-ir = { path = "crates/zirk-ir" }
zirk-lexer = { path = "crates/zirk-lexer" }
zirk-parser = { path = "crates/zirk-parser" }
zirk-sema = { path = "crates/zirk-sema" }

# Segmentación de graphemes extendidos (UAX #29), para `Char` (roadmap Fase
# 3b): decidir si un literal `'...'` contiene exactamente un grapheme es
# semántica, no léxico (ver el comentario de `character()` en zirk-lexer).
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex = "1.13.1"

# inkwell no se declara acá: su conjunto de features depende del target y se
# define en crates/zirk-codegen-llvm/Cargo.toml. Ver el issue #2.

[profile.release]
lto = true
codegen-units = 1
