[workspace]
resolver = "3"
members = ["crates/*"]

[patch.crates-io]
# Pinned h3 0.0.8 lacks the RFC 9220 WebSocket value for Extended CONNECT.
h3 = { path = "vendor/h3" }

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
notify = "=8.2.0"
# Crates internos. Las dependencias entre etapas fluyen en un solo sentido
# a lo largo del pipeline; zirk-diagnostics es la unica transversal permitida.
zirk-ast = { path = "crates/zirk-ast" }
zirk-browser = { path = "crates/zirk-browser" }
zirk-codegen-llvm = { path = "crates/zirk-codegen-llvm" }
zirk-diagnostics = { path = "crates/zirk-diagnostics" }
zirk-format = { path = "crates/zirk-format" }
zirk-ide = { path = "crates/zirk-ide" }
zirk-ir = { path = "crates/zirk-ir" }
zirk-lexer = { path = "crates/zirk-lexer" }
zirk-parser = { path = "crates/zirk-parser" }
zirk-sema = { path = "crates/zirk-sema" }
zirk-runtime-core = { path = "crates/zirk-runtime-core" }
zirk-interpreter = { path = "crates/zirk-interpreter" }
zirk-cli = { path = "crates/zirk-cli", default-features = false }

# Segmentación de graphemes extendidos (UAX #29), para `Char` (roadmap Fase
# 3b): decidir si un literal `'...'` contiene exactamente un grapheme es
# semántica, no léxico (ver el comentario de `character()` en zirk-lexer).
unicode-segmentation = "1"
unicode-normalization = "0.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
semver = "1.0.27"
sha2 = "0.10"
base64 = "0.22.1"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
hmac = "0.12"
getrandom = "0.2.17"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.55"
js-sys = "0.3.105"
num-bigint = "0.4.6"
num-traits = "0.2.19"
http = "1.5.0"
httpdate = "1.0.3"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
url = "2.5.8"
mime = "0.3.17"
sfv = "0.15.0"
percent-encoding = "2.3.2"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8.5"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }

# inkwell no se declara acá: su conjunto de features depende del target y se
# define en crates/zirk-codegen-llvm/Cargo.toml. Ver el issue #2.

[profile.release]
lto = true
codegen-units = 1
