# Workspace dependency license policy. New licenses fail closed until they
# have been reviewed and added explicitly.
# The bundled Mozilla Public Suffix List data has a separate MPL-2.0 notice;
# cargo-deny checks crate license expressions, so that data license is tracked
# in the dependency inventory rather than allowed for arbitrary crates here.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
]
confidence-threshold = 0.93
include-dev = true
unused-allowed-license = "warn"

# Unicode-3.0 is required by the current ICU4X IDNA dependency graph. Keep it
# scoped to exact audited crate versions instead of accepting it globally.
exceptions = [
    { allow = ["Unicode-3.0"], name = "icu_collections", version = "=2.3.0" },
    { allow = ["Unicode-3.0"], name = "icu_locale_core", version = "=2.3.0" },
    { allow = ["Unicode-3.0"], name = "icu_normalizer", version = "=2.3.0" },
    { allow = ["Unicode-3.0"], name = "icu_normalizer_data", version = "=2.3.0" },
    { allow = ["Unicode-3.0"], name = "icu_properties", version = "=2.3.0" },
    { allow = ["Unicode-3.0"], name = "icu_properties_data", version = "=2.3.0" },
    { allow = ["Unicode-3.0"], name = "icu_provider", version = "=2.3.1" },
    { allow = ["Unicode-3.0"], name = "litemap", version = "=0.8.3" },
    { allow = ["Unicode-3.0"], name = "potential_utf", version = "=0.1.6" },
    { allow = ["Unicode-3.0"], name = "tinystr", version = "=0.8.4" },
    { allow = ["Unicode-3.0"], name = "unicode-ident", version = "=1.0.24" },
    { allow = ["Unicode-3.0"], name = "writeable", version = "=0.6.4" },
    { allow = ["Unicode-3.0"], name = "yoke", version = "=0.8.3" },
    { allow = ["Unicode-3.0"], name = "yoke-derive", version = "=0.8.2" },
    { allow = ["Unicode-3.0"], name = "zerofrom", version = "=0.1.8" },
    { allow = ["Unicode-3.0"], name = "zerofrom-derive", version = "=0.1.7" },
    { allow = ["Unicode-3.0"], name = "zerotrie", version = "=0.2.5" },
    { allow = ["Unicode-3.0"], name = "zerovec", version = "=0.11.8" },
    { allow = ["Unicode-3.0"], name = "zerovec-derive", version = "=0.11.6" },
    # `winx` is used by cap-primitives for Windows filesystem handles. Keep its
    # LLVM exception scoped to the exact transitive version in the lockfile.
    { allow = ["Apache-2.0 WITH LLVM-exception"], name = "winx", version = "=0.36.4" },
]
