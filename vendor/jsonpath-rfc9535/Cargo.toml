[package]
name = "jsonpath-rfc9535"
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "RFC 9535 JSONPath evaluator vendored with bounded evaluation support"

[features]
default = ["regex"]
compare = ["regex", "scan"]
rayon = ["dep:rayon"]
regex = ["dep:memchr", "dep:regex"]
scan = ["dep:rsonpath-lib", "dep:rsonpath-syntax"]

[dependencies]
memchr = { version = "2.8", optional = true }
nom = "8"
rayon = { version = "1.12", optional = true }
regex = { version = "1.12.4", optional = true }
rsonpath-lib = { version = "0.10", optional = true }
rsonpath-syntax = { version = "0.4", optional = true }
serde_json = "1.0.151"

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[[test]]
name = "compliance_test_suite"
path = "tests/compliance_test_suite.rs"
required-features = ["regex"]
