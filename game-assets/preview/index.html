<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zirk game assets</title>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "zirk-assets": "/src/index.js"
} }
</script>
<style>
  :root { color-scheme: dark; --bg:#09090b; --surface:#111116; --text:#f7f7fa; --muted:#8a8a98; --violet:#8e6cff; --cyan:#39c6ff; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 "Space Grotesk", system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  nav { position:fixed; top:12px; left:12px; right:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; z-index:2; }
  nav button { background:var(--surface); color:var(--text); border:1px solid #ffffff1f; border-radius:10px; padding:8px 12px; min-height:36px; cursor:pointer; font:inherit; }
  nav button[aria-pressed="true"] { border-color:var(--violet); background:#1b1330; }
  nav button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  nav .hint { color:var(--muted); margin-left:auto; }
  body.shot nav { display:none; }
</style>
</head>
<body>
<nav aria-label="Asset categories"></nav>
<div id="app" role="img" aria-label="3D preview of the Zirk game assets"></div>
<script type="module" src="/preview/preview.js"></script>
</body>
</html>
