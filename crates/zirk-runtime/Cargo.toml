[package]
name = "zirk-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# staticlib produce el artefacto que se enlaza en los binarios que Zirk genera.
# rlib existe solo para poder testear el crate desde Cargo.
crate-type = ["staticlib", "rlib"]

[dependencies]
unicode-segmentation.workspace = true
regex = { workspace = true }
unicode-normalization.workspace = true
zirk-runtime-core.workspace = true
zirk-diagnostics.workspace = true
sha2.workspace = true
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
async-compression = { version = "0.4.51", default-features = false, features = ["tokio", "brotli", "gzip", "zlib"] }
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
bytes = "1"
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
http-body-util = "0.1"
http.workspace = true
mime.workspace = true
hyper = { version = "1", default-features = false, features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
futures-util.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[dev-dependencies]

# Stackful-coroutine stack switching for `task`/`await` (ADR-017). Only pulled
# in on the targets it covers and that run the executor (ADR-004 addendum);
# every other host uses the thread-backed fallback in `src/context.rs`. This
# predicate MUST stay in sync with `build.rs`.
[target.'cfg(any(all(target_arch = "x86_64", any(target_os = "linux", target_os = "macos", target_os = "windows")), all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos"))))'.dependencies]
corosensei = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Environment"] }
