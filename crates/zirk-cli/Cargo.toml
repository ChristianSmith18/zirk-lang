[package]
name = "zirk-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "zirk"
path = "src/main.rs"

[[bin]]
name = "zirk-check"
path = "src/bin/zirk-check.rs"

[features]
default = ["backend"]
backend = ["dep:zirk-ir", "dep:zirk-codegen-llvm"]

[dependencies]
zirk-diagnostics.workspace = true
zirk-codegen-llvm = { workspace = true, optional = true }
zirk-lexer.workspace = true
zirk-ast.workspace = true
zirk-parser.workspace = true
zirk-sema.workspace = true
zirk-runtime-core.workspace = true
zirk-format.workspace = true
zirk-ir = { workspace = true, optional = true }
sha2.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true

[dev-dependencies]
bytes = "1"
futures-util.workspace = true
http-body-util = "0.1"
http.workspace = true
hyper = { version = "1", default-features = false, features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"
libc = "0.2"
