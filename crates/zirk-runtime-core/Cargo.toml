[package]
name = "zirk-runtime-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native-http", "http-values", "regex-perf"]
native-http = ["http-values", "dep:httpdate", "dep:psl2"]
http-values = ["dep:http", "dep:mime", "dep:sfv", "dep:percent-encoding", "dep:js-sys", "dep:wasm-bindgen"]
regex-perf = ["regex/perf"]

[dependencies]
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-general-category.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
icu_datetime.workspace = true
icu_datetime_data.workspace = true
icu_locale_core.workspace = true
icu_locale_fallback.workspace = true
icu_provider.workspace = true
zerovec.workspace = true
regex.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
psl2 = { version = "0.1.32", default-features = false, optional = true }
mime = { workspace = true, optional = true }
sfv = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
url.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
serde_jcs = "=0.2.0"
jsonpath-rfc9535.workspace = true
jsonschema = { version = "=0.49.9", default-features = false }
sha2.workspace = true
base64.workspace = true
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
