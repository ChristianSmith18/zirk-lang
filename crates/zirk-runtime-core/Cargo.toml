[package]
name = "zirk-runtime-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native-http", "http-values", "regex-perf"]
native-http = ["http-values", "dep:httpdate", "dep:psl2"]
http-values = ["dep:http", "dep:mime", "dep:sfv", "dep:percent-encoding", "dep:url", "dep:js-sys", "dep:wasm-bindgen"]
regex-perf = ["regex/perf"]

[dependencies]
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
regex.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
psl2 = { version = "0.1.32", default-features = false, optional = true }
mime = { workspace = true, optional = true }
sfv = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
