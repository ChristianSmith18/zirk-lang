[package]
name = "zirk-sema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["timezone"]
timezone = ["dep:chrono-tz"]

[dependencies]
zirk-diagnostics.workspace = true
zirk-ast.workspace = true
zirk-runtime-core = { path = "../zirk-runtime-core", default-features = false }
chrono.workspace = true
chrono-tz = { workspace = true, optional = true }
unicode-segmentation.workspace = true
regex.workspace = true

[dev-dependencies]
zirk-lexer.workspace = true
zirk-parser.workspace = true
