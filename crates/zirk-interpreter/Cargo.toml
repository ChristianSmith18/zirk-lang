[package]
name = "zirk-interpreter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["timezone", "http", "regex-perf"]
timezone = ["zirk-ir/timezone"]
http = ["zirk-runtime-core/http-values"]
regex-perf = ["zirk-runtime-core/regex-perf"]

[dependencies]
zirk-diagnostics.workspace = true
zirk-ir = { path = "../zirk-ir", default-features = false }
zirk-runtime-core = { path = "../zirk-runtime-core", default-features = false }
serde_json.workspace = true
